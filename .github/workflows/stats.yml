name: Refresh GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '38 3 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_stats.py'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

concurrency:
  group: reapbone-stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Generate own GitHub stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/update_stats.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- assets/stats.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.svg
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          fi
