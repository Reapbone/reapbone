<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="310" viewBox="0 0 1160 310" role="img" aria-labelledby="t d">
<title id="t">Reapbone terminal animation</title><desc id="d">Terminal status panel with animated command lines describing AI-powered development.</desc>
<defs><linearGradient id="a" x2="1" y2="1"><stop stop-color="#0d1020"/><stop offset="1" stop-color="#0c1b22"/></linearGradient><clipPath id="border"><rect width="1160" height="310" rx="18"/></clipPath></defs>
<style>.line1{animation:appear 9s infinite}.line2{animation:appear2 9s infinite}.line3{animation:appear3 9s infinite}.line4{animation:appear4 9s infinite}.blink{animation:blink 1s step-end infinite}.bar{animation:growing 9s ease-in-out infinite;transform-origin:0 0}@keyframes appear{0%,5%{opacity:0}10%,100%{opacity:1}}@keyframes appear2{0%,18%{opacity:0}26%,100%{opacity:1}}@keyframes appear3{0%,39%{opacity:0}47%,100%{opacity:1}}@keyframes appear4{0%,63%{opacity:0}70%,100%{opacity:1}}@keyframes growing{0%,28%{transform:scaleX(0)}62%,100%{transform:scaleX(1)}}@keyframes blink{50%{opacity:0}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<g clip-path="url(#border)"><rect width="1160" height="310" fill="url(#a)"/><rect x="1" y="1" width="1158" height="308" rx="17" stroke="#545270" fill="none"/>
<rect width="1160" height="50" fill="#1b1a2d"/><circle cx="25" cy="25" r="6" fill="#fb6e84"/><circle cx="48" cy="25" r="6" fill="#ffcf70"/><circle cx="71" cy="25" r="6" fill="#62e3b8"/><text x="580" y="30" text-anchor="middle" font-family="Consolas,Monaco,monospace" fill="#a9a6c2" font-size="15" letter-spacing="2">reapbone@creative-lab — ~/build</text>
<g font-family="Consolas,Monaco,monospace" font-size="19">
<g class="line1"><text x="34" y="95" fill="#69e9c4">❯</text><text x="64" y="95" fill="#e1dcf4"> whoami</text><text x="34" y="124" font-size="17" fill="#afa4ff">reapbone</text><text x="176" y="124" font-size="17" fill="#b5b3c9">— creative developer, AI explorer</text></g>
<g class="line2"><text x="34" y="162" fill="#69e9c4">❯</text><text x="64" y="162" fill="#e1dcf4"> current.focus</text><text x="34" y="192" font-size="17" fill="#b5b3c9">AI-powered ideas · creative tools · constant learning</text></g>
<g class="line3"><text x="34" y="230" fill="#69e9c4">❯</text><text x="64" y="230" fill="#e1dcf4"> build --from curiosity --to reality</text><rect x="34" y="247" width="620" height="5" rx="2" fill="#3d3857"/><rect class="bar" x="34" y="247" width="620" height="5" rx="2" fill="#8f81ff"/></g>
<g class="line4"><text x="34" y="285" fill="#63f4bf">✔</text><text x="65" y="285" fill="#b5b3c9">Still experimenting. Always building.</text><rect class="blink" x="598" y="270" width="10" height="17" fill="#63f4bf"/></g>
</g>
<g transform="translate(910 112)" opacity=".72"><circle r="62" cx="34" cy="35" stroke="#5f5c96" stroke-width="1" fill="none" stroke-dasharray="4 12"/><circle cx="34" cy="35" r="40" stroke="#58e9b8" stroke-opacity=".5" fill="none"/><path d="M7 35L23 18L48 28L59 52M23 18L49 7M48 28L66 17" stroke="#c9bcff" stroke-width="2" fill="none"/><g fill="#a99aff"><circle cx="7" cy="35" r="4"/><circle cx="23" cy="18" r="5"/><circle cx="48" cy="28" r="5"/><circle cx="59" cy="52" r="4"/></g><circle cx="66" cy="17" r="5" fill="#61f2c4"/></g>
</g></svg>
